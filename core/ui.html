<!doctype html>
<!-- Single-file trading UI. No build: React, htm, and noble-ed25519 from esm.sh.
     Signing bytes match core/types.py encode(). Budget: < 1,000 lines. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>tiny</title>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@19.3.1",
      "react-dom/client": "https://esm.sh/react-dom@19.3.1/client?external=react",
      "htm": "https://esm.sh/htm@3.1.1",
      "@noble/ed25519": "https://esm.sh/@noble/ed25519@3.2.0",
      "lightweight-charts": "https://esm.sh/lightweight-charts@5.2.1"
    }
  }
  </script>
  <style>
    :root { color-scheme: light; --line: rgb(0 0 0 / 25%); }
    * { box-sizing: border-box; }
    html, body, #root { height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #fff;
      color: #000;
      font-family: sans-serif;
      font-size: 12px;
      line-height: 1.35;
      font-variant-numeric: tabular-nums;
    }
    button, input, select {
      font: inherit;
      font-variant-numeric: tabular-nums;
      color: #000;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 0;
      box-shadow: none;
      padding: 1px 6px;
      line-height: 1.4;
      appearance: none;
      -webkit-appearance: none;
    }
    button:disabled { color: #000; background: #fff; opacity: 1; }
    :focus { outline: 1px solid #000; outline-offset: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid var(--line); padding: 2px 6px; text-align: right; white-space: nowrap; }
    th { font-weight: bold; }
    .l { text-align: left; }
    select {
      font-weight: bold;
      font-size: 16px;
      padding-right: 18px;
      background-image: linear-gradient(45deg, transparent 50%, #000 50%), linear-gradient(135deg, #000 50%, transparent 50%);
      background-position: calc(100% - 12px) 55%, calc(100% - 7px) 55%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }
    .on, tr.on td, button.on { background: #000; color: #fff; border-color: #000; }
    thead td { font-weight: bold; }
    table, thead, tbody, tr, th, td { border-color: var(--line); }
    .app {
      height: 100vh;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px 320px;
      grid-template-rows: auto minmax(0, 1fr) 200px;
    }
    header {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: baseline;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding: 8px 12px;
    }
    .quote { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
    .chart {
      grid-column: 1;
      grid-row: 2;
      min-width: 0;
      min-height: 0;
      padding: 6px 10px 4px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .plot { position: relative; min-width: 0; min-height: 0; }
    a { color: #000; }
    .depth {
      grid-column: 2;
      grid-row: 2;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      border-left: 1px solid var(--line);
      overflow: hidden;
    }
    .side {
      grid-column: 3;
      grid-row: 2;
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: auto;
    }
    .tape, .side, .pane { min-width: 0; min-height: 0; overflow: auto; }
    .book { min-width: 0; min-height: 0; overflow: hidden; }
    .tape { overflow-anchor: none; }
    .dock {
      grid-column: 1 / -1;
      grid-row: 3;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 0;
    }
    .tabs { display: flex; border-bottom: 1px solid var(--line); }
    .tabs button { border-width: 0 1px 0 0; }
    .pad { padding: 6px 10px; border-bottom: 1px solid var(--line); }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .row + .row, .pad > div + div { margin-top: 4px; }
    .grow { min-height: 0; overflow: auto; border-bottom: 0; }
    button.px { border: 0; padding: 0; background: transparent; }
    .book table, .book thead, .book tbody { display: block; width: 100%; }
    .book tr { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr) minmax(0, 1fr); position: relative; z-index: 0; }
    .book td { border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 1px 8px; }
    .book tr.ask::after, .book tr.bid::after { content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; left: calc(100% * 1.15 / 3.15); width: calc(var(--w) * 2 / 3.15); background: rgb(198 40 40 / 32%); }
    .book tr.bid::after { background: rgb(27 138 62 / 32%); }
    .book button.px.ask, .tape td.ask { color: #c62828; }
    .book button.px.bid, .tape td.bid { color: #18803a; }
    .book tr.mid td { font-weight: bold; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { createElement, useEffect, useRef, useState } from "react";
    import { createRoot } from "react-dom/client";
    import htm from "htm";
    import * as ed from "@noble/ed25519";
    // TradingView Lightweight Charts. Copyright (c) 2025 TradingView, Inc. https://www.tradingview.com/
    import { CandlestickSeries, ColorType, LineSeries, createChart } from "lightweight-charts";

    const html = htm.bind(createElement);
    const SCALE = 1000000n;
    const FEED_LIMIT = 50;

    function bi(n) {
      if (typeof n === "bigint") return n;
      if (typeof n === "number") {
        if (!Number.isSafeInteger(n)) throw new Error("use bigint above 2^53");
        return BigInt(n);
      }
      if (typeof n === "string" && /^-?\d+$/.test(n)) return BigInt(n);
      throw new Error("not an int");
    }

    function fmt(n) {
      if (n == null || n === "") return "-";
      const v = bi(n);
      const neg = v < 0n;
      const a = neg ? -v : v;
      const frac = (a % SCALE).toString().padStart(6, "0");
      return (neg ? "-" : "") + (a / SCALE).toString() + "." + frac;
    }

    function fmtSign(n) {
      if (n == null || n === "") return "-";
      const v = bi(n);
      return v > 0n ? "+" + fmt(v) : fmt(v);
    }

    function parseScaled(text) {
      const s = String(text).trim();
      if (!/^\d+(\.\d+)?$/.test(s)) throw new Error("enter a number");
      const [whole, frac = ""] = s.split(".");
      if (frac.length > 6) throw new Error("at most 6 decimal places");
      return BigInt(whole) * SCALE + BigInt((frac + "000000").slice(0, 6));
    }

    function unscale(n) {
      const v = bi(n);
      const neg = v < 0n;
      const a = neg ? -v : v;
      const frac = (a % SCALE).toString().padStart(6, "0").replace(/0+$/, "");
      const whole = (a / SCALE).toString();
      const body = frac ? whole + "." + frac : whole;
      return neg ? "-" + body : body;
    }

    function tryScaled(text) {
      try {
        return parseScaled(text);
      } catch {
        return null;
      }
    }

    function short(value) {
      if (value == null || value === "") return "-";
      return String(value).slice(0, 8);
    }

    function bytesToHex(bytes) {
      let out = "";
      for (const b of bytes) out += b.toString(16).padStart(2, "0");
      return out;
    }

    function quote(text) {
      let out = '"';
      for (const ch of text) {
        const c = ch.codePointAt(0);
        if (ch === '"') out += '\\"';
        else if (ch === "\\") out += "\\\\";
        else if (ch === "\b") out += "\\b";
        else if (ch === "\f") out += "\\f";
        else if (ch === "\n") out += "\\n";
        else if (ch === "\r") out += "\\r";
        else if (ch === "\t") out += "\\t";
        else if (c < 0x20 || c > 0x7e) out += unicode(c);
        else out += ch;
      }
      return out + '"';
    }

    function unicode(c) {
      if (c > 0xffff) {
        const u = c - 0x10000;
        return unit(0xd800 + (u >> 10)) + unit(0xdc00 + (u & 0x3ff));
      }
      return unit(c);
    }

    function unit(c) {
      return "\\u" + c.toString(16).padStart(4, "0");
    }

    // core/types.py encode: sorted keys, separators "," and ":", ensure_ascii, ints only.
    function canonicalize(value) {
      if (value === null) return "null";
      if (value === true) return "true";
      if (value === false) return "false";
      if (typeof value === "bigint") return value.toString();
      if (typeof value === "number") {
        if (!Number.isInteger(value)) throw new Error("encode refuses floats");
        if (!Number.isSafeInteger(value)) throw new Error("use bigint above 2^53");
        return Object.is(value, -0) ? "0" : String(value);
      }
      if (typeof value === "string") return quote(value);
      if (value instanceof Uint8Array) return quote(bytesToHex(value));
      if (Array.isArray(value)) return "[" + value.map(canonicalize).join(",") + "]";
      if (typeof value === "object") {
        const keys = Object.keys(value).sort();
        const parts = keys.map((key) => quote(key) + ":" + canonicalize(value[key]));
        return "{" + parts.join(",") + "}";
      }
      throw new Error("cannot encode " + typeof value);
    }

    async function errorText(res) {
      const text = await res.text();
      let body;
      try {
        body = JSON.parse(text);
      } catch {
        return text || String(res.status);
      }
      const detail = body.detail;
      if (res.status === 422 && Array.isArray(detail)) {
        return detail.map((item) => {
          const loc = Array.isArray(item.loc) ? item.loc.join(".") : "";
          return loc ? loc + ": " + item.msg : item.msg;
        }).join("; ");
      }
      if (typeof detail === "string") return detail;
      if (detail != null) return JSON.stringify(detail);
      return text || String(res.status);
    }

    async function signAndPost(secret, body, nonce) {
      const signer = bytesToHex(await ed.getPublicKeyAsync(secret));
      const payload = new TextEncoder().encode(canonicalize([body, signer, nonce]));
      const sig = bytesToHex(await ed.signAsync(payload, secret));
      const res = await fetch("/tx", {
        method: "POST",
        // application/json is decoded before the bytes parameter, so the handler
        // never sees the raw document. The body is still the JSON object.
        headers: { "content-type": "application/octet-stream" },
        body: canonicalize({ body, signer, nonce, sig }),
      });
      if (res.ok) return res.json();
      const error = new Error(await errorText(res));
      error.status = res.status;
      throw error;
    }

    function useWebSocket(path, onMessage) {
      const [status, setStatus] = useState("connecting");
      const handler = useRef(onMessage);
      handler.current = onMessage;
      useEffect(() => {
        let ws = null;
        let timer = 0;
        let attempt = 0;
        let stopped = false;
        const connect = () => {
          if (stopped) return;
          const proto = location.protocol === "https:" ? "wss:" : "ws:";
          ws = new WebSocket(proto + "//" + location.host + path);
          ws.onopen = () => {
            attempt = 0;
            setStatus("live");
          };
          ws.onmessage = (ev) => {
            try {
              handler.current(JSON.parse(ev.data));
            } catch {
              /* ignore a bad frame */
            }
          };
          ws.onclose = () => {
            if (stopped) return;
            setStatus("reconnecting");
            const delay = Math.min(500 * 2 ** attempt, 8000);
            attempt += 1;
            timer = setTimeout(connect, delay);
          };
        };
        connect();
        return () => {
          stopped = true;
          clearTimeout(timer);
          if (ws) ws.close();
        };
      }, [path]);
      return status;
    }

    function td(child, opts = {}) {
      return html`<td
        className=${opts.cls || null}
        colSpan=${opts.span || null}
        onClick=${opts.onClick || null}
      >${child}</td>`;
    }

    function tr(cells, opts = {}) {
      return html`<tr
        key=${opts.key}
        className=${opts.cls || null}
        style=${opts.style || null}
        onClick=${opts.onClick || null}
      >${cells}</tr>`;
    }

    function Header({ status, ws, market, markets, selected, onSelect, last }) {
      const s = status || {};
      const m = market || {};
      const options = markets.length
        ? markets.map((item) => html`<option key=${item.name} value=${item.name}>${item.name}</option>`)
        : html`<option value="">tiny</option>`;
      return html`<header>
        <div className="quote">
          <select value=${selected} onChange=${(e) => onSelect(e.target.value)}>${options}</select>
          <span><b>${last ? last.side : "last"}</b> ${fmt(last && last.price)}</span>
          <span><b>mark</b> ${fmt(m.mark_price)}</span>
          <span><b>oracle</b> ${fmt(m.oracle_price)}</span>
          <span><b>funding</b> ${m.funding_index ?? "-"}</span>
        </div>
        <div className="quote">
          <span>node ${s.node ?? "-"}</span>
          <span>height ${s.height ?? "-"}</span>
          <span>view ${s.view ?? "-"}</span>
          <span>${short(s.tip)}</span>
          <b>${ws}</b>
        </div>
      </header>`;
    }

    function spreadMid(book) {
      if (book == null || book.best_bid == null || book.best_ask == null) {
        return { spread: null, mid: null, pct: "-" };
      }
      const bid = bi(book.best_bid);
      const ask = bi(book.best_ask);
      const mid = (bid + ask) / 2n;
      const spread = ask - bid;
      let pct = "-";
      if (mid > 0n) {
        const milli = (spread * 100000n) / mid;
        pct = (milli / 1000n).toString() + "." + (milli % 1000n).toString().padStart(3, "0") + "%";
      }
      return { spread, mid, pct };
    }

    function priceOf(src) {
      if (!src) return null;
      if (src.mark_price != null) return src.mark_price;
      if (src.best_bid != null && src.best_ask != null) return (bi(src.best_bid) + bi(src.best_ask)) / 2n;
      return src.best_bid ?? src.best_ask ?? src.oracle_price ?? null;
    }

    function note(book, price, at) {
      const value = Number(bi(price)) / 1e6;
      const sec = book.sec || [];
      const lastS = sec[sec.length - 1];
      const offset = book.offset;
      if (at != null && offset == null) return book;
      const stamped = at != null && Number(at) > 0 ? Math.floor(Number(at) / 1000) + offset : null;
      const time = stamped == null ? (lastS ? lastS.time : null) : stamped;
      if (time == null || (lastS && time < lastS.time)) return book;
      const nextSec = (lastS && lastS.time === time ? sec.slice(0, -1) : sec).concat([{ time, value }]).slice(-180);
      const minute = time - (time % 60);
      const bars = book.bars || [];
      const lastB = bars[bars.length - 1];
      if (lastB && minute < lastB.time) return { ...book, sec: nextSec };
      const bar = !lastB || lastB.time !== minute
        ? { time: minute, open: value, high: value, low: value, close: value }
        : { ...lastB, high: Math.max(lastB.high, value), low: Math.min(lastB.low, value), close: value };
      const nextBars = (lastB && lastB.time === minute ? bars.slice(0, -1) : bars).concat([bar]).slice(-60);
      return { offset, sec: nextSec, bars: nextBars };
    }

    function seed(book, rows) {
      let max = 0;
      for (const row of rows) if (Number(row.timestamp_ms) > max) max = Number(row.timestamp_ms);
      let next = book.offset != null ? book : { ...book, offset: max > 0 ? Math.floor(Date.now() / 1000) - Math.floor(max / 1000) : 0 };
      for (let i = rows.length - 1; i >= 0; i--) if (rows[i].price != null) next = note(next, rows[i].price, rows[i].timestamp_ms);
      return next;
    }

    function remember(series, market, src) {
      const price = priceOf(src);
      if (price == null) return series;
      return { ...series, [market]: note(series[market] || {}, price) };
    }

    function rememberPrint(series, market, trade) {
      if (trade.price == null) return series;
      return { ...series, [market]: note(series[market] || {}, trade.price, trade.timestamp_ms) };
    }

    function Chart({ market, points }) {
      const host = useRef(null);
      const api = useRef(null);
      const [span, setSpan] = useState("1m");
      useEffect(() => {
        const edge = "rgba(0, 0, 0, 0.25)";
        const chart = createChart(host.current, {
          autoSize: true,
          layout: { background: { type: ColorType.Solid, color: "#fff" }, textColor: "#000", fontFamily: "sans-serif", fontSize: 12, attributionLogo: false },
          grid: { vertLines: { color: "rgba(0, 0, 0, 0.12)" }, horzLines: { color: "rgba(0, 0, 0, 0.12)" } },
          rightPriceScale: { borderColor: edge },
          timeScale: { borderColor: edge, timeVisible: true, secondsVisible: false, barSpacing: 12, rightOffset: 4 },
          crosshair: { vertLine: { color: "#000", labelBackgroundColor: "#000" }, horzLine: { color: "#000", labelBackgroundColor: "#000" } },
        });
        api.current = {
          chart,
          candles: chart.addSeries(CandlestickSeries, {
            upColor: "#18803a", downColor: "#c62828", borderUpColor: "#18803a", borderDownColor: "#c62828", wickUpColor: "#18803a", wickDownColor: "#c62828",
          }),
          line: chart.addSeries(LineSeries, { color: "#000", lineWidth: 2 }),
        };
        return () => { chart.remove(); api.current = null; };
      }, []);
      useEffect(() => {
        const plot = api.current;
        if (!plot) return;
        const seconds = span === "1s";
        plot.chart.applyOptions({ timeScale: { secondsVisible: seconds } });
        plot.candles.setData(seconds ? [] : points.bars || []);
        plot.line.setData(seconds ? points.sec || [] : []);
      }, [points, span]);
      const rows = span === "1s" ? points.sec : points.bars;
      const last = rows && rows.length ? rows[rows.length - 1] : null;
      const shown = last ? (span === "1s" ? last.value : last.close) : null;
      return html`<section className="chart">
        <div className="row"><b>${market || "chart"}</b><button type="button" className=${span === "1m" ? "on" : ""} onClick=${() => setSpan("1m")}>1m</button><button type="button" className=${span === "1s" ? "on" : ""} onClick=${() => setSpan("1s")}>1s</button><span>${shown == null ? "no price" : shown.toFixed(6)}</span><a href="https://www.tradingview.com/" target="_blank" rel="noreferrer">TradingView</a></div>
        <div className="plot" ref=${host}></div>
      </section>`;
    }

    function Tape({ prints, tint }) {
      const rows = (prints || []).slice(0, 40).map((p) => tr([
        td(p.height),
        td(p.side, { cls: "l" }),
        td(fmt(p.price), tint ? { cls: p.side === "buy" ? "bid" : "ask" } : {}),
        td(fmt(p.size)),
      ], { key: "p" + p.seq }));
      return html`<section className="tape"><table>
        <thead>${tr([td("h"), td("side", { cls: "l" }), td("price"), td("size")])}</thead>
        <tbody>${rows.length ? rows : tr([td("none", { cls: "l", span: 4 })])}</tbody>
      </table></section>`;
    }

    function Book({ book, onPrice }) {
      const levels = (side) => (book?.[side] || []).slice(0, 14);
      const totals = (rows) => {
        let sum = 0n;
        return rows.map((level) => {
          const size = bi(level[1]);
          sum += size;
          return { price: level[0], size, total: sum };
        });
      };
      const askRows = totals(levels("asks")).reverse();
      const bidRows = totals(levels("bids"));
      let max = 1n;
      for (const row of askRows.concat(bidRows)) if (row.total > max) max = row.total;
      const levelRow = (row, side, key) => {
        let pct = Number((row.total * 100n) / max);
        if (row.total > 0n && pct < 1) pct = 1;
        return tr([
          td(html`<button type="button" className=${"px " + side} onClick=${() => onPrice(row.price)}>${fmt(row.price)}</button>`, { cls: "l" }),
          td(fmt(row.size)),
          td(fmt(row.total)),
        ], { key, cls: side, style: { "--w": pct + "%" } });
      };
      const { spread, pct } = spreadMid(book);
      const body = [];
      for (let i = 0; i < askRows.length; i++) body.push(levelRow(askRows[i], "ask", "a" + askRows[i].price));
      body.push(tr([td("Spread", { cls: "l" }), td(fmt(spread)), td(pct)], { key: "mid", cls: "mid" }));
      for (let i = 0; i < bidRows.length; i++) body.push(levelRow(bidRows[i], "bid", "b" + bidRows[i].price));
      return html`<section className="book"><table>
        <thead>${tr([td("Price", { cls: "l" }), td("Size"), td("Total")])}</thead>
        <tbody>${body}</tbody>
      </table></section>`;
    }

    function Ladder({ market, book, prints, onPrice }) {
      const [tab, setTab] = useState("book");
      const names = [["book", "Order Book"], ["trades", "Trades"]];
      const mine = (prints || []).filter((p) => p.market === market);
      return html`<section className="depth">${[
        html`<div className="tabs">${names.map(([id, label]) => html`<button type="button" key=${id} className=${tab === id ? "on" : ""} onClick=${() => setTab(id)}>${label}</button>`)}</div>`,
        tab === "book"
          ? html`<${Book} book=${book} onPrice=${onPrice} />`
          : html`<${Tape} prints=${mine} tint=${true} />`,
      ]}</section>`;
    }

    function Dock({ tab, setTab, account, markets, orders, onCancel, prints, blocks }) {
      const tabs = ["positions", "orders", "trades", "blocks"];
      let pane = html`<${Feed} blocks=${blocks} />`;
      if (tab === "positions") pane = html`<${Account} account=${account} markets=${markets} />`;
      else if (tab === "orders") pane = html`<${Cancel} orders=${orders} onCancel=${onCancel} />`;
      else if (tab === "trades") pane = html`<${Tape} prints=${prints} />`;
      return html`<section className="dock">
        <div className="tabs">${tabs.map((name) => html`<button type="button" key=${name} className=${tab === name ? "on" : ""} onClick=${() => setTab(name)}>${name}</button>`)}</div>
        <div className="pane">${pane}</div>
      </section>`;
    }

    function gridNote(market, size, price, orderType) {
      if (size != null && market && bi(market.lot_size) > 0n && size % bi(market.lot_size) !== 0n) {
        return "off lot";
      }
      if (orderType === "limit" && price != null && market && bi(market.tick_size) > 0n) {
        if (price % bi(market.tick_size) !== 0n) return "off tick";
      }
      return "";
    }

    function OrderForm({ form, patch, market, book, nonce, orderId, pending, note, bad, onSubmit }) {
      const size = tryScaled(form.size);
      const limitPx = form.type === "limit" ? tryScaled(form.price) : 0n;
      let touch = null;
      if (form.type === "market" && book) {
        touch = form.side === "buy" ? book.best_ask : book.best_bid;
      }
      const notionalPx = form.type === "market" ? (touch == null ? null : bi(touch)) : limitPx;
      const notional = size != null && notionalPx != null ? (notionalPx * size) / SCALE : null;
      const problem = gridNote(market, size, limitPx, form.type);
      const submit = (e) => {
        e.preventDefault();
        if (!pending && !problem) onSubmit();
      };
      return html`<form className="pad" onSubmit=${submit}>
        <div className="row">
          <button type="button" className=${form.side === "buy" ? "on" : ""} onClick=${() => patch({ side: "buy" })}>B buy</button>
          <button type="button" className=${form.side === "sell" ? "on" : ""} onClick=${() => patch({ side: "sell" })}>S sell</button>
          <button type="button" className=${form.type === "limit" ? "on" : ""} onClick=${() => patch({ type: "limit" })}>limit</button>
          <button type="button" className=${form.type === "market" ? "on" : ""} onClick=${() => patch({ type: "market" })}>market</button>
        </div>
        <div className="row">
          <span>size</span>
          <input value=${form.size} onInput=${(e) => patch({ size: e.target.value })} />
          ${form.type === "limit" ? html`<span>price</span><input value=${form.price} onInput=${(e) => patch({ price: e.target.value })} />` : null}
        </div>
        <div className="row">
          <button type="button" className=${form.reduceOnly ? "on" : ""} onClick=${() => patch({ reduceOnly: !form.reduceOnly })}>reduce-only</button>
          <span>notional ${fmt(notional)}</span>
        </div>
        <div>int size ${size == null ? "-" : size.toString()} price ${limitPx == null ? "-" : limitPx.toString()} ${problem}</div>
        <div className="row">
          <span>id ${orderId} nonce ${nonce}</span>
          <button type="submit">${pending ? "sending" : "place"}</button>
        </div>
        ${note ? html`<div className=${bad ? "on" : ""}>${note}</div>` : null}
      </form>`;
    }

    function Cancel({ orders, onCancel }) {
      const rows = orders.map((o) => tr([
        td(o.market, { cls: "l" }),
        td(String(o.id)),
        td(o.side === "buy" ? "B" : "S"),
        td(fmt(o.price)),
        td(fmt(o.size)),
        td(html`<button type="button" onClick=${() => onCancel(o)}>cancel</button>`),
      ], { key: o.market + ":" + o.id }));
      return html`<section className="pad grow"><b>cancel</b>
        ${rows.length ? html`<table><tbody>${rows}</tbody></table>` : html`<div>none</div>`}
      </section>`;
    }

    function entryPrice(pos) {
      const size = bi(pos.size);
      if (size === 0n) return 0n;
      const abs = size < 0n ? -size : size;
      return (bi(pos.entry_notional) * SCALE) / abs;
    }

    function upnl(pos, mark) {
      if (mark == null) return null;
      const size = bi(pos.size);
      const abs = size < 0n ? -size : size;
      const notional = (abs * bi(mark)) / SCALE;
      const entry = bi(pos.entry_notional);
      return size > 0n ? notional - entry : entry - notional;
    }

    function Account({ account, markets }) {
      const positions = Object.values(account?.positions || {}).sort((a, b) =>
        String(a.market).localeCompare(String(b.market)),
      );
      const markOf = (name) => {
        const found = markets.find((m) => m.name === name);
        return found ? found.mark_price : null;
      };
      const rows = positions.map((p) => {
        const size = bi(p.size);
        const side = size > 0n ? "B" : size < 0n ? "S" : "";
        return tr([
          td(p.market, { cls: "l" }),
          td(fmtSign(size) + " " + side),
          td(fmt(entryPrice(p))),
          td(fmtSign(upnl(p, markOf(p.market)))),
        ], { key: p.market });
      });
      return html`<section className="pad grow">
        <b>account</b> ${account ? "" : "none"}
        <div>collateral ${fmt(account?.collateral ?? 0)}</div>
        <div>account value ${fmt(account?.account_value ?? 0)}</div>
        <div>maintenance margin ${fmt(account?.maintenance_margin ?? 0)}</div>
        <table>
          <thead>${tr([td("market", { cls: "l" }), td("size"), td("entry"), td("pnl")])}</thead>
          <tbody>${rows.length ? rows : tr([td("none", { cls: "l", span: 4 })])}</tbody>
        </table>
      </section>`;
    }

    function Feed({ blocks }) {
      const rows = [];
      for (const block of blocks) {
        const txs = block.txs || [];
        rows.push(tr([
          td(block.height),
          td(short(block.hash), { cls: "l" }),
          td(txs.length + " tx", { cls: "l", span: 2 }),
        ], { key: "b" + block.height }));
        txs.forEach((tx, i) => {
          rows.push(tr([
            td(""),
            td(tx.kind, { cls: "l" }),
            td(short(tx.signer), { cls: "l" }),
            td(tx.nonce),
          ], { key: block.height + "-" + i }));
        });
      }
      return html`<section className="feed"><table>
        <thead>${tr([td("height"), td("hash / kind", { cls: "l" }), td("signer", { cls: "l" }), td("nonce")])}</thead>
        <tbody>${rows.length ? rows : tr([td("none", { cls: "l", span: 4 })])}</tbody>
      </table></section>`;
    }

    function KeyBox({ hex, trader, error, onHex, onGenerate }) {
      return html`<div className="pad">
        <div className="row">
          <b>private key</b>
          <button type="button" onClick=${onGenerate}>generate</button>
        </div>
        <input className="key" spellCheck=${false} autoComplete="off" value=${hex} onInput=${(e) => onHex(e.target.value)} />
        <div>trader ${trader || "-"}</div>
        ${error ? html`<div className="on">${error}</div>` : null}
      </div>`;
    }

    function App() {
      const [status, setStatus] = useState(null);
      const [markets, setMarkets] = useState([]);
      const [books, setBooks] = useState({});
      const [series, setSeries] = useState({});
      const [selected, setSelected] = useState("");
      const [feed, setFeed] = useState([]);
      const [prints, setPrints] = useState([]);
      const [tab, setTab] = useState("positions");
      const [hex, setHex] = useState("");
      const [key, setKey] = useState(null);
      const [keyError, setKeyError] = useState("");
      const [account, setAccount] = useState(null);
      const [sent, setSent] = useState([]);
      const [form, setForm] = useState({
        side: "buy", type: "limit", size: "1", price: "100", reduceOnly: false,
      });
      const [note, setNote] = useState("");
      const [bad, setBad] = useState(false);
      const [pending, setPending] = useState(false);
      const localNonce = useRef(0);
      const nextId = useRef(1);
      const busy = useRef(false);
      const keyToken = useRef(0);
      const [, bumpNonce] = useState(0);

      const onWs = (msg) => {
        if (msg.type === "block") {
          setFeed((xs) => [msg, ...xs].slice(0, FEED_LIMIT));
          setStatus((s) => ({ ...(s || {}), height: msg.height, view: msg.view, tip: msg.hash }));
          fetch("/markets").then(async (res) => {
            if (res.ok) setMarkets(await res.json());
          }).catch(() => {});
        } else if (msg.type === "book") {
          setBooks((prev) => ({ ...prev, [msg.market]: msg }));
          setSeries((prev) => remember(prev, msg.market, msg));
        } else if (msg.type === "trade") {
          setPrints((xs) => (xs.some((p) => p.seq === msg.seq) ? xs : [msg, ...xs].slice(0, 40)));
          setSeries((prev) => rememberPrint(prev, msg.market, msg));
        }
      };
      const ws = useWebSocket("/ws", onWs);

      useEffect(() => {
        let stop = false;
        const tick = async () => {
          try {
            const res = await fetch("/status");
            if (!stop && res.ok) setStatus(await res.json());
          } catch {
            /* keep the last status */
          }
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => {
          stop = true;
          clearInterval(id);
        };
      }, []);

      useEffect(() => {
        let stop = false;
        fetch("/markets").then(async (res) => {
          if (!stop && res.ok) setMarkets(await res.json());
        }).catch(() => {});
        return () => {
          stop = true;
        };
      }, []);

      useEffect(() => {
        if (!selected && markets.length) setSelected(markets[0].name);
      }, [markets, selected]);

      useEffect(() => {
        if (!selected) return;
        let stop = false;
        const load = async (limit) => {
          const res = await fetch("/trades?market=" + encodeURIComponent(selected) + "&limit=" + limit);
          if (stop || !res.ok) return;
          const rows = await res.json();
          setPrints(rows.slice(0, 40));
          setSeries((prev) => ({ ...prev, [selected]: seed(prev[selected] || {}, rows) }));
        };
        let id = 0;
        load(20000).then(async () => {
          if (stop) return;
          const res = await fetch("/book/" + encodeURIComponent(selected) + "?levels=20");
          if (stop || !res.ok) return;
          const book = await res.json();
          setBooks((prev) => ({ ...prev, [selected]: book }));
          setSeries((prev) => remember(prev, selected, book));
          if (!stop) id = setInterval(() => { load(200).catch(() => {}); }, 1000);
        }).catch(() => {});
        return () => { stop = true; clearInterval(id); };
      }, [selected]);

      useEffect(() => {
        if (!key) {
          setAccount(null);
          return;
        }
        let stop = false;
        const tick = async () => {
          try {
            const res = await fetch("/account/" + key.trader);
            if (stop) return;
            if (res.status === 404) {
              setAccount(null);
              return;
            }
            if (res.ok) setAccount(await res.json());
          } catch {
            /* keep the last account */
          }
        };
        tick();
        const id = setInterval(tick, 1000);
        return () => {
          stop = true;
          clearInterval(id);
        };
      }, [key]);

      useEffect(() => {
        localNonce.current = 0;
        setSent([]);
        setAccount(null);
        setNote("");
        setBad(false);
        bumpNonce((n) => n + 1);
      }, [key]);

      const patch = (part) => setForm((prev) => ({ ...prev, ...part }));
      const nonce = Math.max(localNonce.current, account?.nonce ?? 0) + 1;
      const market = markets.find((m) => m.name === selected) || null;
      const book = books[selected] || null;
      const orders = Array.isArray(account?.orders) ? account.orders : sent;

      async function resyncNonce() {
        if (!key) return;
        const res = await fetch("/account/" + key.trader);
        if (res.status === 404) {
          setAccount(null);
          return;
        }
        if (res.ok) {
          const body = await res.json();
          localNonce.current = Math.max(localNonce.current, body.nonce ?? 0);
          setAccount(body);
          bumpNonce((n) => n + 1);
        }
      }

      async function onHex(value) {
        setHex(value);
        const token = ++keyToken.current;
        const clean = value.trim().toLowerCase();
        if (!/^[0-9a-f]{64}$/.test(clean)) {
          setKey(null);
          setKeyError(clean ? "key must be 64 hex chars" : "");
          return;
        }
        try {
          const secret = ed.etc.hexToBytes(clean);
          const trader = bytesToHex(await ed.getPublicKeyAsync(secret));
          if (token !== keyToken.current) return;
          setKey({ secret, trader });
          setKeyError("");
        } catch (err) {
          if (token !== keyToken.current) return;
          setKey(null);
          setKeyError(err.message || String(err));
        }
      }

      async function onGenerate() {
        const token = ++keyToken.current;
        const { secretKey, publicKey } = await ed.keygenAsync();
        if (token !== keyToken.current) return;
        setHex(bytesToHex(secretKey));
        setKey({ secret: secretKey, trader: bytesToHex(publicKey) });
        setKeyError("");
      }

      async function place() {
        if (!key || !selected || busy.current) return;
        const size = tryScaled(form.size);
        const price = form.type === "market" ? 0n : tryScaled(form.price);
        if (size == null || price == null) {
          setBad(true);
          setNote("size and price must be numbers");
          return;
        }
        if (gridNote(market, size, price, form.type)) return;
        if (size <= 0n || (form.type === "limit" && price <= 0n)) {
          setBad(true);
          setNote(form.type === "limit" ? "size and price must be positive" : "size must be positive");
          return;
        }
        busy.current = true;
        setPending(true);
        const sentNonce = Math.max(localNonce.current, account?.nonce ?? 0) + 1;
        const id = nextId.current;
        const body = {
          kind: "place_order",
          order: {
            id,
            trader: key.trader,
            market: selected,
            side: form.side,
            type: form.type,
            price,
            size,
            reduce_only: form.reduceOnly,
          },
        };
        try {
          await signAndPost(key.secret, body, sentNonce);
          localNonce.current = sentNonce;
          nextId.current = id + 1;
          bumpNonce((n) => n + 1);
          if (form.type === "limit") {
            setSent((xs) => [...xs, { id, market: selected, side: form.side, price, size }]);
          }
          setBad(false);
          setNote("accepted nonce " + sentNonce);
        } catch (err) {
          if (err.status === 400) await resyncNonce();
          setBad(true);
          setNote(err.message || String(err));
        } finally {
          busy.current = false;
          setPending(false);
        }
      }

      async function onCancel(order) {
        if (!key || busy.current) return;
        busy.current = true;
        setPending(true);
        const sentNonce = Math.max(localNonce.current, account?.nonce ?? 0) + 1;
        const body = {
          kind: "cancel_order",
          trader: key.trader,
          market: order.market,
          order_id: order.id,
        };
        try {
          await signAndPost(key.secret, body, sentNonce);
          localNonce.current = sentNonce;
          bumpNonce((n) => n + 1);
          setSent((xs) => xs.filter((item) => !(item.market === order.market && item.id === order.id)));
          setBad(false);
          setNote("accepted nonce " + sentNonce);
        } catch (err) {
          if (err.status === 400) await resyncNonce();
          setBad(true);
          setNote(err.message || String(err));
        } finally {
          busy.current = false;
          setPending(false);
        }
      }

      const shell = [
        html`<${Header} status=${status} ws=${ws} market=${market} markets=${markets} selected=${selected} onSelect=${setSelected} last=${prints[0]} />`,
        html`<${Chart} market=${selected} points=${series[selected] || {}} />`,
        html`<${Ladder} market=${selected} book=${book} prints=${prints} onPrice=${(px) => patch({ price: unscale(px), type: "limit" })} />`,
        html`<section className="side">${[
          html`<${KeyBox} hex=${hex} trader=${key?.trader || ""} error=${keyError} onHex=${onHex} onGenerate=${onGenerate} />`,
          html`<div className="pad">
            <b>account</b> ${account ? "" : "none"}
            <div>collateral ${fmt(account?.collateral ?? 0)}</div>
            <div>value ${fmt(account?.account_value ?? 0)}</div>
            <div>margin ${fmt(account?.maintenance_margin ?? 0)}</div>
          </div>`,
          html`<${OrderForm} form=${form} patch=${patch} market=${market} book=${book} nonce=${nonce} orderId=${nextId.current} pending=${pending} note=${note} bad=${bad} onSubmit=${place} />`,
          html`<${Cancel} orders=${orders} onCancel=${onCancel} />`,
        ]}</section>`,
        html`<${Dock} tab=${tab} setTab=${setTab} account=${account} markets=${markets} orders=${orders} onCancel=${onCancel} prints=${prints} blocks=${feed} />`,
      ];
      return html`<div className="app">${shell}</div>`;
    }

    createRoot(document.getElementById("root")).render(html`<${App} />`);
  </script>
</body>
</html>
